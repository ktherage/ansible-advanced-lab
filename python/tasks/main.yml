---
# tasks file for python
    - name: 'Install dependencies'
      ansible.builtin.apt:
        name:
          - build-essential
          - python3
          - python3-setuptools
          - python3-dev
          - python3-pip
          - python3-mysqldb
          - python3-venv
        state: "present"

